<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>T3 Patcher</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --panel: #f5f5f7;
        --bad: #c0362c;
        --good: #1e7e34;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --panel: #1c1c1e; background: #111; }
      }
      body { margin: 0; }
      main { max-width: 820px; margin: 0 auto; padding: 16px 24px 32px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 0 0 8px; }
      section { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; }
      .row, .fields { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      .fields input { flex: 1 1 200px; }
      input[type="text"], input:not([type]) { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
      button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .lines { list-style: none; margin: 0; padding: 8px; background: var(--panel); border-radius: 6px; font: 13px/1.5 ui-monospace, Menlo, monospace; min-height: 1.5em; }
      .steps li.failed { color: var(--bad); }
      .steps li.passed { color: var(--good); }
      .steps li.skipped, .steps li.pending { color: var(--muted); }
      /* The note shows under its step but isn't part of the line's text (journeys read each line's text). */
      .steps li[data-note]:not([data-note=""])::after { content: attr(data-note); display: block; white-space: pre-wrap; color: var(--muted); padding-left: 2ch; }
      .message { min-height: 1.4em; margin: 6px 0 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
